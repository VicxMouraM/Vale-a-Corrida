<!-- Supabase → Authentication → Emails → Reset password
     Assunto: Crie uma nova senha no Vale a Corrida -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #131921;">
  <h2 style="margin: 0 0 8px;">Vale a <span style="color: #145c8a;">Corrida?</span></h2>
  <p>Recebemos um pedido para criar uma nova senha para a sua conta.</p>
  <p>
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="display: inline-block; background: #145c8a; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">
      Criar nova senha
    </a>
  </p>
  <p style="font-size: 13px; color: #586270;">O link expira em pouco tempo e só funciona uma vez.</p>
  <p style="font-size: 13px; color: #586270;">Se não foi você, ignore este e-mail: sua senha continua a mesma.</p>
</div>
