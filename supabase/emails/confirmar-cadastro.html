<!-- Supabase → Authentication → Emails → Confirm signup
     Assunto: Confirme seu cadastro no Vale a Corrida -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; color: #131921;">
  <h2 style="margin: 0 0 8px;">Vale a <span style="color: #145c8a;">Corrida?</span></h2>
  <p>Olá! Falta só confirmar o seu e-mail para ativar a conta.</p>
  <p>
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #145c8a; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">
      Confirmar meu e-mail
    </a>
  </p>
  <p style="font-size: 13px; color: #586270;">Abra o link no mesmo aparelho em que você criou a conta.</p>
  <p style="font-size: 13px; color: #586270;">Se você não criou uma conta no Vale a Corrida, ignore este e-mail.</p>
</div>
